name: Portfolio
# Publishes the portfolio page (portfolio/) on GitHub Pages when it changes on main.
on:
  push:
    branches: [main]
    paths: ["portfolio/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Only what deploying to Pages needs (SEC-09): read the code, write Pages, an OIDC token for it.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, like GitHub's Jekyll starter: when the deploy ran in the same job right after the
  # upload, the API didn't list the new artifact yet ("No artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: portfolio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
